# Openship deployment: the platform behind Openship's own HTTPS edge (OpenResty on 80/443).
# Openship routes the public URLs, so no service publishes host ports and there is no Caddy here.
#
# ibos-34 is a shared server, so nothing here gets the host's Docker socket. Instead:
# - Each platform container's Google tagging and preview servers are services of this project, named
#   sst-<container id>-tagging / sst-<container id>-preview (the gateway reaches them by that name).
#   Adding a website container therefore means adding its two services here and redeploying.
# - The provisioner runs with DRIVER=external: it starts nothing, it checks each tagging server's /healthy and
#   reports the container Active or Failed in the dashboard.
# - Each tracking domain (e.g. ss.travilo.io) is a custom domain on the gateway service in Openship, which issues
#   its certificate. On a dedicated server, deploy/server does all of this automatically.
#
# Secrets (ADMIN_API_KEY, INTERNAL_API_TOKEN, SESSION_SECRET, GOOGLE_CLIENT_ID/SECRET, SUPER_ADMIN_EMAILS,
# EDGE_HOSTNAME, POSTGRES_PASSWORD
# and DATABASE_URL=postgresql://sst:<POSTGRES_PASSWORD>@postgres:5432/sst) are project environment variables in
# Openship, and each tagging service's CONTAINER_CONFIG is a service variable; none are in this file. They are
# deliberately not listed below: a `${VAR}` entry here is saved by Openship as an empty service value that
# overrides the project variable.
#
# The upload puts this file at the archive root, with every build context rewritten from ../.. to "."
# (Openship's scan only detects a compose file at the root).

name: sst

x-restart: &restart
  restart: unless-stopped

services:
  redis:
    <<: *restart
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: [redis:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sst
      POSTGRES_DB: sst
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'sst', '-d', 'sst']
      interval: 5s
      retries: 10

  api:
    <<: *restart
    build: { context: ../.., args: { APP: api } }
    environment:
      # Installs from before PostgreSQL: the API copies this SQLite file once into the empty database at
      # startup (opened read-only, left as it is). Remove the volume once PostgreSQL has the data.
      SQLITE_IMPORT_FILE: /app/data/sst.db
      REDIS_URL: redis://redis:6379
      TAGGING_UPSTREAM_TEMPLATE: http://sst-{id}-tagging:8080
    expose: ['3000']
    volumes: [apidata:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  gateway:
    <<: *restart
    build: { context: ../.., args: { APP: gateway } }
    environment:
      API_INTERNAL_URL: http://api:3001
      REDIS_URL: redis://redis:6379
      # Openship's edge is the one proxy in front.
      TRUSTED_PROXY_HOPS: '1'
    expose: ['8080']
    depends_on:
      redis: { condition: service_healthy }

  dashboard:
    <<: *restart
    build: { context: ../.., dockerfile: apps/dashboard/Dockerfile }
    environment:
      API_URL: http://api:3000
      DASHBOARD_URL: https://sst.ibos.agency
    expose: ['3100']
    depends_on: [api]

  provisioner:
    <<: *restart
    build: { context: ../.., args: { APP: provisioner } }
    environment:
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:3001
      DRIVER: external
      EXTERNAL_UPSTREAM_TEMPLATE: http://sst-{id}-tagging:8080
    depends_on:
      redis: { condition: service_healthy }
      api: { condition: service_started }

  # Travilo-production (container chukjbhcigtx2, GTM-TSC24Z44).
  sst-chukjbhcigtx2-tagging:
    <<: *restart
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    environment:
      # Google's image only accepts a public https:// preview address: the preview service below has the
      # Openship custom domain travilo-preview.ibos.agency (port 8080; Cloudflare CNAME to sst.ibos.agency).
      PREVIEW_SERVER_URL: https://travilo-preview.ibos.agency
    expose: ['8080']

  sst-chukjbhcigtx2-preview:
    <<: *restart
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:stable
    environment:
      RUN_AS_PREVIEW_SERVER: 'true'
    expose: ['8080']

  # Web UI for the database at https://pgadmin.ibos.agency (Openship custom domain on port 80). The login email
  # (PGADMIN_DEFAULT_EMAIL) is a service variable and PGADMIN_DEFAULT_PASSWORD a project variable; Openship also
  # mounts /pgadmin4/servers.json, which adds the "SST (live)" server (host postgres, user sst) on first start.
  pgadmin:
    <<: *restart
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DISABLE_POSTFIX: 'true'
    expose: ['80']
    volumes: [pgadmin:/var/lib/pgadmin]
    depends_on: [postgres]

volumes:
  redis:
  pgdata:
  pgadmin:
  apidata:
